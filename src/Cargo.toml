[workspace]
members = [
    "apps/cli",
    "apps/control",
    "apps/tool",
    "crates/facts",
    "crates/foundation",
    "crates/proto",
    "crates/proto/codegen",
    "crates/repo",
    "crates/store",
    "crates/task",
]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
keyring = "4.2.0"
notify = "8.2.0"
pbjson = "0.9.0"
pbjson-build = "0.9.0"
prost = "0.14.4"
prost-types = "0.14.4"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/yesme/hctl2"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
