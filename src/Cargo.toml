[workspace]
members = [
    "apps/hctl2-tool",
    "crates/hctl2-facts",
    "crates/hctl2-foundation",
]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
keyring = "4.2.0"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/yesme/hctl2"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
