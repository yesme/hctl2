[workspace]
members = [
    "agency",
    "apps/cli",
    "apps/control",
    "apps/tool",
    "crates/chat",
    "crates/agency-proto",
    "crates/context",
    "crates/dagu-api",
    "crates/dagu-api/codegen",
    "crates/participant",
    "crates/facts",
    "crates/gate-tally",
    "crates/foundation",
    "crates/proto",
    "crates/proto/codegen",
    "crates/project",
    "crates/repo",
    "crates/run",
    "crates/store",
    "crates/task",
]
resolver = "3"

[workspace.dependencies]
base64 = "=0.22.1"
bytes = "1.12.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
futures-core = "0.3.34"
openapiv3 = "=2.2.0"
prettyplease = "0.2.37"
progenitor = { version = "=0.14.0", default-features = false }
progenitor-client = "=0.14.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "query", "stream"] }
ruma = { version = "=0.16.0", default-features = false, features = ["client-api-c", "appservice-api-s", "events", "rand"] }
rustix = { version = "=1.1.5", features = ["process"] }
clap = { version = "4.6.6", features = ["derive"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
hmac = "=0.13.0"
keyring = "4.2.0"
notify = "8.2.0"
pbjson = "0.9.0"
process_control = { version = "=5.2.0", default-features = false }
pbjson-build = "0.9.0"
prost = "0.14.4"
prost-types = "0.14.4"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
serde_yaml = "=0.9.34+deprecated"
sha2 = "0.11.0"
syn = { version = "2.0.119", features = ["full", "parsing"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/yesme/hctl2"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
