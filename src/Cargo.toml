[workspace]
members = [
    "apps/hctl2-agentd",
    "apps/hctl2-tool",
    "apps/hctl2-web-server",
    "crates/hctl2-protocol",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/yesme/hctl2"
publish = false

[workspace.dependencies]
hctl2-protocol = { path = "crates/hctl2-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
