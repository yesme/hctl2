version: "0.5"

processes:
  gitea:
    description: HCTL2 local code collaboration platform
    command: '"${HCTL2_BIN_DIR}/gitea" web --config "${HCTL2_GITEA_CONFIG}"'
    working_dir: "${HCTL2_GITEA_WORK}"
    environment:
      - "HOME=${HCTL2_GITEA_WORK}"
      - "USER=${USER}"
    log_location: "${HCTL2_LOG_DIR}/gitea.log"
    availability:
      restart: on_failure
      backoff_seconds: 1
      max_restarts: 5
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: /api/healthz
        port: "${GITEA_PORT}"
      initial_delay_seconds: 0
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 60
    shutdown:
      signal: 15
      timeout_seconds: 20
