# `cargo:include` in the upstream build script expands CARGO_MANIFEST_DIR at
# compile time; the value only feeds buildtime_bindgen consumers and is inert
# for bundled_bindings. Same mechanism as the proc-macro2 fixup.
cargo_env = ["CARGO_MANIFEST_DIR"]

# The table form implies run = true. cc-rs requires Cargo's OPT_LEVEL at run
# time; the Buck2 prelude only injects it when the rust toolchain carries a
# literal -Copt-level=N flag, which this repository does not set. 2 is SQLite
# upstream's recommended optimization level. rustc_link_lib/search translate
# the build script's cargo:rustc-link-lib/-search output into rustc flags.
[buildscript.run]
env = { OPT_LEVEL = "2" }
rustc_link_lib = true
rustc_link_search = true
