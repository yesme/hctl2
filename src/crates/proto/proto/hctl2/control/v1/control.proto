syntax = "proto3";

package hctl2.control.v1;

// Public control contract for Query / Preview / Submit / Subscribe.
// Domain Git bodies stay JCS; this schema is transport only.

message Error {
  string code = 1;
  string message = 2;
  string recovery_action = 3;
}

message Protocol {
  // Must equal "hctl2.control.v1" for this revision.
  string version = 1;
}

message QueryRequest {
  Protocol protocol = 1;
  // status | doctor | pending | overview | backup.verify | restore.preview
  string kind = 2;
  bytes payload = 3;
}

message QueryResponse {
  optional Error error = 1;
  bytes payload = 2;
  int64 event_seq = 3;
}

message PreviewRequest {
  Protocol protocol = 1;
  string operation = 2;
  bytes payload = 3;
  string command_id = 4;
}

message PreviewResponse {
  optional Error error = 1;
  string preview_token = 2;
  bool dangerous = 3;
  bytes effect_summary = 4;
}

message SubmitRequest {
  Protocol protocol = 1;
  string operation = 2;
  bytes payload = 3;
  string command_id = 4;
  string idempotency_key = 5;
  string preview_token = 6;
}

message SubmitResponse {
  optional Error error = 1;
  bytes result = 2;
  int64 event_seq = 3;
}

message SubscribeRequest {
  Protocol protocol = 1;
  // 0 means live tail. A positive value is the last seq the client processed.
  int64 since_seq = 2;
}

message SubscribeEvent {
  optional Error error = 1;
  int64 seq = 2;
  string kind = 3;
  bytes payload = 4;
  bool snapshot = 5;
}

service Control {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Preview(PreviewRequest) returns (PreviewResponse);
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeEvent);
}
