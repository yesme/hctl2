name: Code

on:
  push:
    paths:
      - ".github/workflows/code.yml"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/code.yml"
      - "src/**"

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust workspace / Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt

      - name: Check packaging shell syntax
        run: find packaging/dependencies -type f \( -name '*.sh' -o -name hctl2-services \) -print0 | xargs -0 bash -n

      - name: Check service command help
        run: |
          packaging/dependencies/hctl2-services --help | grep -F 'Usage:'
          if packaging/dependencies/hctl2-services status unexpected >/dev/null 2>&1; then
            echo 'hctl2-services accepted an argument for status' >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets

  rust-macos:
    name: Rust workspace / macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt

      - name: Check packaging shell syntax
        run: find packaging/dependencies -type f \( -name '*.sh' -o -name hctl2-services \) -print0 | xargs -0 bash -n

      - name: Check service command help
        run: |
          packaging/dependencies/hctl2-services --help | grep -F 'Usage:'
          if packaging/dependencies/hctl2-services status unexpected >/dev/null 2>&1; then
            echo 'hctl2-services accepted an argument for status' >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
