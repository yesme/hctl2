name: Code

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Detect first-party / CI paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq \
            '^(src/|\.github/workflows/code\.yml$|buck2$|\.buckconfig$|\.buckroot$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  buck:
    name: Buck2 / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: linux_x86_64_gnu
            uname_s: Linux
            uname_m: x86_64
          - platform: macOS x86_64
            runner: macos-15-intel
            target: macos_x86_64
            uname_s: Darwin
            uname_m: x86_64
          - platform: macOS arm64
            runner: macos-15
            target: macos_arm64
            uname_s: Darwin
            uname_m: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BUCK_CONSOLE: simple

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Restore Buck2 cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/dotslash
            buck-out
          key: buck2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('buck2', '.buckconfig', 'src/build/platforms/**', 'src/build/toolchains/**') }}

      - name: Install pinned DotSlash
        run: |
          src/build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Verify runner and tools
        run: |
          test "$(uname -s)" = "${{ matrix.uname_s }}"
          test "$(uname -m)" = "${{ matrix.uname_m }}"
          dotslash --version
          ./buck2 --version

      - name: Analyze target graph
        run: >-
          ./buck2 cquery root//src/...
          --target-platforms root//src/build/platforms:${{ matrix.target }}

      - name: Build first-party targets
        run: >-
          ./buck2 build root//src/...
          --target-platforms root//src/build/platforms:${{ matrix.target }}

      - name: Test first-party targets
        run: >-
          ./buck2 test root//src/...
          --target-platforms root//src/build/platforms:${{ matrix.target }}

      - name: Run Clippy
        run: >-
          ./buck2 build root//src:clippy
          --target-platforms root//src/build/platforms:${{ matrix.target }}

  cargo-parity:
    name: Cargo parity / Linux x86_64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install parity toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt

      - name: Verify toolchain
        run: rustc +1.98.0 --version | grep -F 'rustc 1.98.0'

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Run Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo +1.98.0 build --locked --workspace --all-targets

      - name: Test workspace
        run: cargo +1.98.0 test --locked --workspace --all-targets

  ci-gate:
    name: CI gate
    needs: [changes, buck, cargo-parity]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUCK: ${{ needs.buck.result }}
          CARGO: ${{ needs.cargo-parity.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE buck=$BUCK cargo=$CARGO"
          test "$CHANGES" = success
          if [ "$CODE" != true ]; then
            echo "No first-party or CI paths; skip Buck2 and Cargo."
            exit 0
          fi
          test "$BUCK" = success
          test "$CARGO" = success
