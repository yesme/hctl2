name: Code

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Detect first-party / CI paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          # src/build/docs/ is doc-lint tooling: it triggers the docs checks,
          # not the three-platform build matrix.
          if printf '%s\n' "$changed" | grep -E \
            '^(src/(apps|build|crates|third-party)/|src/[^/]+$|\.github/workflows/code\.yml$)' \
            | grep -qv '^src/build/docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE \
            '^(docs/|\.memo/|README\.md$|AGENTS\.md$|CLAUDE\.md$|CONSTRAINTS\.md$|src/build/docs/|\.github/workflows/code\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned build linters
        run: |
          src/build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: >-
          src/build/tools/actionlint-bin
          -shellcheck 'src/build/tools/shellcheck-bin --severity=error'
          .github/workflows/*.yml

      - name: Lint shell action bodies and launchers
        run: |
          find src -path src/buck-out -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 src/build/tools/shellcheck-bin --severity=error -x
          src/build/tools/shellcheck-bin --severity=error -x \
            src/buck2 \
            src/build/tools/buck2-cache \
            src/build/tools/install-dotslash \
            src/build/tools/reindeer \
            src/packaging/dependencies/hctl2-services

  pr-contract:
    name: PR contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Check required PR sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          stripped=$(printf '%s' "$PR_BODY" | perl -0777 -pe 's/<!--.*?-->//gs; s/\r//g')

          section() {
            printf '%s\n' "$stripped" | awk -v h="## $1" '
              index($0, h) == 1 {found=1; next}
              /^## / {if (found) exit}
              found {print}
            '
          }

          fail=0
          for h in 定位与重述 当前生效约束集 业界方案调研; do
            if ! printf '%s\n' "$stripped" | grep -q "^## $h"; then
              echo "::error::PR 描述缺少必填节 '## $h'（模板见 .github/pull_request_template.md）"
              fail=1
            elif [ -z "$(section "$h" | tr -d '[:space:]')" ]; then
              echo "::error::必填节 '## $h' 是空的——填上内容，不要删掉注释了事"
              fail=1
            fi
          done

          git fetch --no-tags --prune origin "$BASE_REF"
          new_components=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
            | grep -E '(\.sh$|^src/build/tools/|^src/third-party/)' || true)
          research_compact=$(section 业界方案调研 | tr -d '[:space:]')
          if [ -n "$new_components" ] && [ "$research_compact" = "不适用" ]; then
            echo "::error::本 PR 新增了脚本/工具/三方组件，但'业界方案调研'节写着'不适用'："
            printf '%s\n' "$new_components"
            echo "::error::先查业界方案与平台 native 机制，落 docs/research/ 或在该节说明为何自建。"
            fail=1
          fi

          exit "$fail"

  buck:
    name: Buck2 / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: linux_x86_64_gnu
            uname_s: Linux
            uname_m: x86_64
          - platform: macOS x86_64
            runner: macos-15-intel
            target: macos_x86_64
            uname_s: Darwin
            uname_m: x86_64
          - platform: macOS arm64
            runner: macos-15
            target: macos_arm64
            uname_s: Darwin
            uname_m: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: 0
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned DotSlash
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Verify runner and tools
        run: |
          test "$(uname -s)" = "${{ matrix.uname_s }}"
          test "$(uname -m)" = "${{ matrix.uname_m }}"
          dotslash --version
          ./buck2 --version

      - name: Analyze target graph
        run: >-
          ./buck2 cquery 'set(root//apps/... root//crates/... root//build/tests/...)'
          --target-platforms root//build/platforms:${{ matrix.target }}

      - name: Build first-party targets
        run: >-
          ./buck2 build root//apps/... root//crates/... root//build/tests/...
          --target-platforms root//build/platforms:${{ matrix.target }}

      - name: Test first-party targets
        run: >-
          ./buck2 test root//apps/... root//crates/... root//build/tests/...
          --target-platforms root//build/platforms:${{ matrix.target }}

      - name: Run Clippy
        run: >-
          ./buck2 build root//:clippy
          --target-platforms root//build/platforms:${{ matrix.target }}

  cargo-parity:
    name: Cargo parity / Linux x86_64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install parity toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt

      - name: Verify toolchain
        run: rustc +1.98.0 --version | grep -F 'rustc 1.98.0'

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Run Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo +1.98.0 build --locked --workspace --all-targets

      - name: Test workspace
        run: cargo +1.98.0 test --locked --workspace --all-targets

  docs-check:
    name: Docs checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: 0
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned DotSlash
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Materialize doc lint inputs
        run: build/docs/materialize_repo_tree.sh

      - name: Run doc checks
        run: ./buck2 test root//build/docs/...

      - name: Prohibition density report (report-only)
        run: build/docs/report_prohibition_density.sh build/docs/repo_tree

  ci-gate:
    name: CI gate
    needs: [changes, pr-contract, buck, cargo-parity, docs-check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          CONTRACT: ${{ needs.pr-contract.result }}
          BUCK: ${{ needs.buck.result }}
          CARGO: ${{ needs.cargo-parity.result }}
          DOCSCHECK: ${{ needs.docs-check.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE docs=$DOCS contract=$CONTRACT buck=$BUCK cargo=$CARGO docs-check=$DOCSCHECK"
          test "$CHANGES" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$CONTRACT" = success
          fi
          if [ "$DOCS" = true ]; then
            test "$DOCSCHECK" = success
          fi
          if [ "$CODE" != true ]; then
            echo "No first-party or CI paths; skip Buck2 and Cargo."
            exit 0
          fi
          test "$BUCK" = success
          test "$CARGO" = success
