name: Code

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: code-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      buck: ${{ steps.targets.outputs.buck }}
      cargo: ${{ steps.paths.outputs.cargo }}
      docs: ${{ steps.paths.outputs.docs }}
      targets: ${{ steps.targets.outputs.targets }}
      target_mode: ${{ steps.targets.outputs.mode }}
      doc_targets: ${{ steps.paths.outputs.doc_targets }}
      validation_base: ${{ steps.validation.outputs.base }}
      validation_head: ${{ steps.validation.outputs.head }}
      validation_mode: ${{ steps.validation.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Resolve validation range
        id: validation
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "base=HEAD" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
            echo "mode=full-periodic" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -n "$BASE_COMMIT"
          test -n "$CURRENT_HEAD"
          candidate=$(git rev-parse --verify 'HEAD^{commit}')
          base=$BASE_COMMIT
          mode=full-pr

          if [ "$EVENT_ACTION" = synchronize ] && [ -n "$PREVIOUS_HEAD" ]; then
            if ! git merge-base --is-ancestor "$PREVIOUS_HEAD" "$CURRENT_HEAD"; then
              echo "::notice::The PR history was rewritten; validate the complete PR diff."
              mode=full-pr-rewritten
            elif workflow_runs=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/code.yml/runs" \
              -f head_sha="$PREVIOUS_HEAD" \
              -f event=pull_request \
              -f status=completed \
              -f per_page=100); then
              if printf '%s' "$workflow_runs" | src/build/tools/jq-bin -e \
                --arg head "$PREVIOUS_HEAD" \
                'any(.workflow_runs[]; .head_sha == $head and .conclusion == "success")' \
                >/dev/null; then
                base=$PREVIOUS_HEAD
                mode=incremental-validated-head
              else
                echo "::notice::The previous PR head has no successful Code run; validate the complete PR diff."
                mode=full-pr-no-prior-success
              fi
            else
              echo "::warning::Could not query the previous Code run; validate the complete PR diff."
              mode=full-pr-query-fallback
            fi
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$candidate" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Validation mode: $mode"
          echo "Validation range: $base...$candidate"

      - name: Detect first-party / CI paths
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT: ${{ steps.validation.outputs.head }}
          VALIDATION_BASE: ${{ steps.validation.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "doc_targets=root//build/docs:profile-all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE_REF"
          changed=$(git diff --no-renames --name-only "$VALIDATION_BASE...$HEAD_COMMIT")
          # src/build/docs/ is doc-lint tooling: it triggers the docs checks,
          # not the three-platform build matrix.
          if printf '%s\n' "$changed" | grep -E \
            '^(src/(agency|apps|build|crates|third-party)/|src/[^/]+$|\.buckconfig$|\.buckroot$|BUCK$|\.github/workflows/code\.yml$)' \
            | grep -qv '^src/build/docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -qE \
            '^(src/(apps|crates)/.*(\.rs|Cargo\.toml)$|src/(Cargo\.lock|Cargo\.toml|reindeer\.toml|rustfmt\.toml|rust-toolchain\.toml)$|src/third-party/rust/BUCK$|\.github/workflows/code\.yml$)'; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -qE \
            '^(\.gitattributes$|\.github/workflows/code\.yml$|BUCK$|src/build/docs/)'; then
            doc_targets="root//build/docs:profile-all"
          else
            doc_targets=$(printf '%s\n' "$changed" \
              | git check-attr --stdin hctl-doc \
              | awk -F ': ' '$3 != "unspecified" && $3 != "memo" {print "root//build/docs:profile-" $3}' \
              | sort -u \
              | xargs)
          fi
          if [ -n "$doc_targets" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          echo "doc_targets=$doc_targets" >> "$GITHUB_OUTPUT"

      - name: Install DotSlash
        uses: facebook/install-dotslash@0971fd2071b83392cf02706266fee3877e3bcaf3

      - name: Verify pinned build linters
        run: |
          . src/build/tools/dotslash.env
          test "$(dotslash --version)" = "DotSlash ${DOTSLASH_VERSION#v}"
          src/build/tools/jq-bin --version | grep -Fx 'jq-1.8.2'

      - name: Lint workflows
        run: >-
          src/build/tools/actionlint-bin
          -shellcheck 'src/build/tools/shellcheck-bin --severity=error'
          .github/workflows/*.yml

      - name: Lint shell action bodies and launchers
        run: |
          find src -path src/buck-out -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 src/build/tools/shellcheck-bin --severity=error -x
          src/build/tools/shellcheck-bin --severity=error -x \
            src/buck2 \
            src/build/ci/affected-targets \
            src/build/tools/install-dotslash \
            src/build/tools/reindeer \
            src/packaging/dependencies/hctl2-services

      - name: Check service command contract
        run: |
          src/packaging/dependencies/hctl2-services --help | grep -F 'Usage:'
          if src/packaging/dependencies/hctl2-services status unexpected >/dev/null 2>&1; then
            echo 'hctl2-services accepted an argument for status' >&2
            exit 1
          fi

      - name: Select impacted Buck targets with BTD
        id: btd
        if: steps.paths.outputs.code == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BUCK_CONSOLE: simple
          HEAD_COMMIT: ${{ steps.validation.outputs.head }}
          HCTL2_BUCK2_CACHE: 0
          VALIDATION_BASE: ${{ steps.validation.outputs.base }}
        run: |
          set -euo pipefail
          graph_dir="$RUNNER_TEMP/hctl2-btd"
          mkdir -p "$graph_dir"
          src/build/ci/affected-targets \
            --base "$VALIDATION_BASE" \
            --head "$HEAD_COMMIT" \
            --output "$graph_dir/selected.txt" \
            --mode-output "$graph_dir/mode.txt"
          echo "BTD selected $(wc -l < "$graph_dir/selected.txt" | tr -d ' ') first-party targets."

      - name: Resolve Buck target selection
        id: targets
        if: steps.paths.outputs.code == 'true'
        env:
          BTD_OUTCOME: ${{ steps.btd.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          full_targets='root//apps/... root//crates/... root//build/tests/... root//:clippy root//packaging/release:first-party'
          selected_file="$RUNNER_TEMP/hctl2-btd/selected.txt"

          if [ "$EVENT_NAME" != pull_request ]; then
            mode=full-periodic
            targets=$full_targets
          elif [ "$BTD_OUTCOME" != success ]; then
            echo "::warning::BTD failed; falling back to the full first-party target set."
            mode=full-btd-fallback
            targets=$full_targets
          else
            mode=$(cat "$RUNNER_TEMP/hctl2-btd/mode.txt")
            targets=$(xargs < "$selected_file")
          fi

          if [ -n "$targets" ]; then
            echo "buck=true" >> "$GITHUB_OUTPUT"
          else
            echo "buck=false" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Buck selection mode: $mode"
          echo "Buck targets: ${targets:-<none>}"

  buck:
    name: Buck2 / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.buck == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: linux_x86_64_gnu
            uname_s: Linux
            uname_m: x86_64
          - platform: macOS x86_64
            runner: macos-15-intel
            target: macos_x86_64
            uname_s: Darwin
            uname_m: x86_64
          - platform: macOS arm64
            runner: macos-15
            target: macos_arm64
            uname_s: Darwin
            uname_m: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: 0
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install DotSlash on Linux
        if: runner.os == 'Linux'
        uses: facebook/install-dotslash@0971fd2071b83392cf02706266fee3877e3bcaf3

      - name: Install pinned DotSlash on macOS
        if: runner.os == 'macOS'
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Verify runner and tools
        run: |
          . build/tools/dotslash.env
          test "$(uname -s)" = "${{ matrix.uname_s }}"
          test "$(uname -m)" = "${{ matrix.uname_m }}"
          test "$(dotslash --version)" = "DotSlash ${DOTSLASH_VERSION#v}"
          build/tools/jq-bin --version | grep -Fx 'jq-1.8.2'
          ./buck2 --version

      - name: Verify first-party targets
        env:
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          read -r -a selected_targets <<< "$TARGETS"
          ./buck2 test --build-default-info "${selected_targets[@]}" \
            --target-platforms root//build/platforms:${{ matrix.target }}

  cargo-parity:
    name: Cargo hygiene / Linux x86_64
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install parity toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Verify toolchain
        run: rustc +1.98.0 --version | grep -F 'rustc 1.98.0'

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Check locked workspace metadata
        run: cargo +1.98.0 metadata --locked --no-deps --format-version 1 >/dev/null

  docs-check:
    name: Docs checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: 0
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install DotSlash
        uses: facebook/install-dotslash@0971fd2071b83392cf02706266fee3877e3bcaf3

      - name: Verify pinned DotSlash
        run: |
          . build/tools/dotslash.env
          test "$(dotslash --version)" = "DotSlash ${DOTSLASH_VERSION#v}"

      - name: Run doc checks
        env:
          DOC_TARGETS: ${{ needs.changes.outputs.doc_targets }}
        run: |
          read -r -a selected_targets <<< "$DOC_TARGETS"
          ./buck2 test "${selected_targets[@]}"

  ci-gate:
    name: CI gate
    needs: [changes, buck, cargo-parity, docs-check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUCK_REQUIRED: ${{ needs.changes.outputs.buck }}
          CARGO_REQUIRED: ${{ needs.changes.outputs.cargo }}
          DOCS: ${{ needs.changes.outputs.docs }}
          TARGET_MODE: ${{ needs.changes.outputs.target_mode }}
          VALIDATION_BASE: ${{ needs.changes.outputs.validation_base }}
          VALIDATION_HEAD: ${{ needs.changes.outputs.validation_head }}
          VALIDATION_MODE: ${{ needs.changes.outputs.validation_mode }}
          BUCK: ${{ needs.buck.result }}
          CARGO: ${{ needs.cargo-parity.result }}
          DOCSCHECK: ${{ needs.docs-check.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE buck-required=$BUCK_REQUIRED cargo-required=$CARGO_REQUIRED docs=$DOCS target-mode=$TARGET_MODE validation-mode=$VALIDATION_MODE validation-range=$VALIDATION_BASE...$VALIDATION_HEAD buck=$BUCK cargo=$CARGO docs-check=$DOCSCHECK"
          test "$CHANGES" = success
          if [ "$DOCS" = true ]; then
            test "$DOCSCHECK" = success
          fi
          if [ "$BUCK_REQUIRED" = true ]; then
            test "$BUCK" = success
          fi
          if [ "$CARGO_REQUIRED" = true ]; then
            test "$CARGO" = success
          fi
          if [ "$CODE" != true ]; then
            echo "No first-party or CI paths; skip target selection."
          fi
