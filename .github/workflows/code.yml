name: Code

on:
  push:
    paths:
      - ".github/workflows/code.yml"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/code.yml"
      - "src/**"

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt

      - name: Check packaging shell syntax
        run: bash -n packaging/dependencies/*.sh packaging/dependencies/hctl2-services

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
