name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Release path filter
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.paths.outputs.release }}
      validation_base: ${{ steps.validation.outputs.base }}
      validation_head: ${{ steps.validation.outputs.head }}
      validation_mode: ${{ steps.validation.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Resolve validation range
        id: validation
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "base=HEAD" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
            echo "mode=full-periodic" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -n "$BASE_COMMIT"
          test -n "$CURRENT_HEAD"
          candidate=$(git rev-parse --verify 'HEAD^{commit}')
          base=$BASE_COMMIT
          mode=full-pr

          if [ "$EVENT_ACTION" = synchronize ] && [ -n "$PREVIOUS_HEAD" ]; then
            if ! git merge-base --is-ancestor "$PREVIOUS_HEAD" "$CURRENT_HEAD"; then
              echo "::notice::The PR history was rewritten; validate the complete PR diff."
              mode=full-pr-rewritten
            else
              # Evaluate the answer with the jq that ships inside gh: this job
              # runs before DotSlash is installed, so no src/build/tools
              # trampoline can run here. Three outcomes are kept apart: a
              # count of successful runs (0 or more), a failed query, and an
              # answer that cannot be evaluated. Only the first one may say
              # "no successful run".
              query_stderr=$(mktemp)
              if successful_runs=$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
                -f head_sha="$PREVIOUS_HEAD" \
                -f event=pull_request \
                -f status=completed \
                -f per_page=100 \
                --jq 'if (.workflow_runs | type) != "array" then error("unexpected workflow_runs type: " + (.workflow_runs | type)) else [.workflow_runs[] | select(.head_sha == $ENV.PREVIOUS_HEAD and .conclusion == "success")] | length end' \
                2>"$query_stderr"); then
                case "$successful_runs" in
                  0)
                    echo "::notice::The previous PR head $PREVIOUS_HEAD has no successful Release run; validate the complete PR diff."
                    mode=full-pr-no-prior-success
                    ;;
                  '' | *[!0-9]*)
                    echo "::warning::The previous Release run query answered '$successful_runs' instead of a count; validate the complete PR diff."
                    mode=full-pr-parse-fallback
                    ;;
                  *)
                    echo "The previous PR head $PREVIOUS_HEAD has $successful_runs successful Release run(s)."
                    base=$PREVIOUS_HEAD
                    mode=incremental-validated-head
                    ;;
                esac
              elif grep -Eq '^gh: |^error connecting to |dial tcp|i/o timeout|TLS handshake' "$query_stderr"; then
                # The three branches below are diagnostic heuristics over gh's
                # stderr, not a complete classification: gh prefixes HTTP and
                # authentication errors with "gh:" and reports connection
                # failures as "error connecting to"; its built-in jq prints
                # bare messages such as "cannot iterate over" or "failed to
                # parse jq expression", and "error: ..." for the filter's own
                # type check on workflow_runs. Text that matches neither is
                # reported as undetermined. All three validate the complete
                # PR diff.
                echo "::warning::Could not query the previous Release run ($(tr '\n' ' ' <"$query_stderr")); validate the complete PR diff."
                mode=full-pr-query-fallback
              elif grep -Eiq '^(error: |cannot |expected |failed to parse jq|invalid |unexpected )' "$query_stderr"; then
                echo "::warning::Could not evaluate the previous Release run answer ($(tr '\n' ' ' <"$query_stderr")); validate the complete PR diff."
                mode=full-pr-parse-fallback
              else
                echo "::warning::Could not determine whether the previous Release run query or its evaluation failed ($(tr '\n' ' ' <"$query_stderr")); validate the complete PR diff."
                mode=full-pr-query-fallback
              fi
              rm -f "$query_stderr"
            fi
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$candidate" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Validation mode: $mode"
          echo "Validation range: $base...$candidate"

      - name: Detect product and release paths
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT: ${{ steps.validation.outputs.head }}
          VALIDATION_BASE: ${{ steps.validation.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE_REF"
          if git diff --no-renames --name-only "$VALIDATION_BASE...$HEAD_COMMIT" | grep -Eq \
            '^(src/(third-party|packaging)/|src/build/(empty_cell|execution|platforms|rules|toolchains)/|src/build/tools/(BUCK|xz\.bzl|bazel-remote-bin|buck2-bin|buck2-cache|dotslash\.env|install-dotslash)$|src/(BUCK|Cargo\.lock|Cargo\.toml|buck2|rust-toolchain\.toml)$|\.buckconfig$|\.buckroot$|BUCK$|src/agency/|\.github/workflows/release\.yml$)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Complete package / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.release == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-26.04
            buck_target: linux_x86_64_gnu
            package_target: linux-x86_64
          - platform: macOS x86_64
            runner: macos-15-intel
            buck_target: macos_x86_64
            package_target: macos-x86_64
          - platform: macOS arm64
            runner: macos-15
            buck_target: macos_arm64
            package_target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    env:
      BUCK_CONSOLE: simple
      # Same bazel-remote REAPI cache as the Code workflow, keyed per platform.
      HCTL2_BUCK2_CACHE: local
      HCTL2_BUCK2_CACHE_MAX_GIB: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Locate Buck2 action cache
        run: echo "HCTL2_BUCK2_CACHE_DIR=$RUNNER_TEMP/hctl2-buck2-cache" >> "$GITHUB_ENV"

      - name: Restore Buck2 action cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/hctl2-buck2-cache/data
          key: buck2-reapi-${{ matrix.buck_target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            buck2-reapi-${{ matrix.buck_target }}-

      - name: Read workspace release version
        id: metadata
        run: |
          version="$(awk '$0 == "[workspace.package]" { found = 1; next } found && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install DotSlash on Linux
        if: runner.os == 'Linux'
        uses: facebook/install-dotslash@0971fd2071b83392cf02706266fee3877e3bcaf3

      - name: Install pinned DotSlash on macOS
        if: runner.os == 'macOS'
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Verify pinned DotSlash
        run: |
          . build/tools/dotslash.env
          test "$(dotslash --version)" = "DotSlash ${DOTSLASH_VERSION#v}"

      - name: Verify release tag matches workspace version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: test "$GITHUB_REF_NAME" = "v${{ steps.metadata.outputs.version }}"

      - name: Build complete release with Buck2
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: >-
          ./buck2 build root//packaging/release:complete
          --target-platforms root//build/platforms:${{ matrix.buck_target }}
          --out "$RUNNER_TEMP/hctl2-release"

      # Pull-request packages are installed and exercised but never published,
      # so they use the fast xz preset; main, tags, schedule and dispatch keep
      # the shipped `release` preset (xz -9).
      - name: Test complete offline install and lifecycle (fast xz preset)
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          ./buck2 test root//packaging/release:complete-test
          --target-platforms root//build/platforms:${{ matrix.buck_target }}
          --config hctl2.xz_preset=fast

      - name: Test complete offline install and lifecycle
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          ./buck2 test root//packaging/release:complete-test
          --target-platforms root//build/platforms:${{ matrix.buck_target }}

      - name: Stop Buck2 action cache
        if: always()
        run: |
          state="$HCTL2_BUCK2_CACHE_DIR/state"
          if [ -S "$state/process-compose.sock" ]; then
            XDG_CONFIG_HOME="$state/config" build/tools/process-compose-bin \
              --use-uds --unix-socket "$state/process-compose.sock" down || true
          fi

      - name: Save Buck2 action cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/hctl2-buck2-cache/data
          key: buck2-reapi-${{ matrix.buck_target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload release artifacts
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hctl2-release-${{ matrix.package_target }}
          path: ${{ runner.temp }}/hctl2-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest release provenance
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/hctl2-release/*

  release-gate:
    name: Release gate
    needs: [changes, package]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate complete package jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEASE: ${{ needs.changes.outputs.release }}
          VALIDATION_BASE: ${{ needs.changes.outputs.validation_base }}
          VALIDATION_HEAD: ${{ needs.changes.outputs.validation_head }}
          VALIDATION_MODE: ${{ needs.changes.outputs.validation_mode }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES release=$RELEASE validation-mode=$VALIDATION_MODE validation-range=$VALIDATION_BASE...$VALIDATION_HEAD package=$PACKAGE"
          test "$CHANGES" = success
          if [ "$RELEASE" != true ]; then
            echo "No product or release paths; skip complete packages."
            exit 0
          fi
          test "$PACKAGE" = success

  publish:
    name: Publish GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: hctl2-release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --verify-tag \
              --title "HCTL2 $GITHUB_REF_NAME" \
              --generate-notes
          fi
