name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Release path filter
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Detect product and release paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE_REF"
          if git diff --no-renames --name-only "origin/${BASE_REF}...HEAD" | grep -Eq \
            '^(src/(third-party|packaging)/|src/build/(empty_cell|execution|platforms|rules|toolchains)/|src/build/tools/(bazel-remote-bin|buck2-bin|buck2-cache|dotslash\.env|install-dotslash)$|src/(\.buckconfig|\.buckroot|BUCK|Cargo\.lock|Cargo\.toml|buck2|rust-toolchain\.toml)$|\.github/workflows/release\.yml$)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Complete package / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.release == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-26.04
            buck_target: linux_x86_64_gnu
            package_target: linux-x86_64
          - platform: macOS x86_64
            runner: macos-15-intel
            buck_target: macos_x86_64
            package_target: macos-x86_64
          - platform: macOS arm64
            runner: macos-15
            buck_target: macos_arm64
            package_target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Read workspace release version
        id: metadata
        run: |
          version="$(awk '$0 == "[workspace.package]" { found = 1; next } found && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install DotSlash on Linux
        if: runner.os == 'Linux'
        uses: facebook/install-dotslash@0971fd2071b83392cf02706266fee3877e3bcaf3

      - name: Install pinned DotSlash on macOS
        if: runner.os == 'macOS'
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Verify pinned DotSlash
        run: |
          . build/tools/dotslash.env
          test "$(dotslash --version)" = "DotSlash ${DOTSLASH_VERSION#v}"

      - name: Verify release tag matches workspace version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: test "$GITHUB_REF_NAME" = "v${{ steps.metadata.outputs.version }}"

      - name: Build complete release with Buck2
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: >-
          ./buck2 build root//packaging/release:complete
          --target-platforms root//build/platforms:${{ matrix.buck_target }}
          --out "$RUNNER_TEMP/hctl2-release"

      - name: Test complete offline install and lifecycle
        run: >-
          ./buck2 test root//packaging/release:complete-test
          --target-platforms root//build/platforms:${{ matrix.buck_target }}

      - name: Upload release artifacts
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hctl2-release-${{ matrix.package_target }}
          path: ${{ runner.temp }}/hctl2-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest release provenance
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/hctl2-release/*

  release-gate:
    name: Release gate
    needs: [changes, package]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate complete package jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEASE: ${{ needs.changes.outputs.release }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES release=$RELEASE package=$PACKAGE"
          test "$CHANGES" = success
          if [ "$RELEASE" != true ]; then
            echo "No product or release paths; skip complete packages."
            exit 0
          fi
          test "$PACKAGE" = success

  publish:
    name: Publish GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: hctl2-release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --verify-tag \
              --title "HCTL2 $GITHUB_REF_NAME" \
              --generate-notes
          fi
