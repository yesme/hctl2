name: PR contract

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: PR contract
    runs-on: ubuntu-24.04
    # Pure script check over the checked-out tree; measured 16 s.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Check required PR sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          stripped=$(printf '%s' "$PR_BODY" | perl -0777 -pe 's/<!--.*?-->//gs; s/\r//g')

          section() {
            printf '%s\n' "$stripped" | awk -v h="## $1" '
              index($0, h) == 1 {found=1; next}
              /^## / {if (found) exit}
              found {print}
            '
          }

          fail=0
          for h in 定位与重述 当前生效约束集 业界方案调研; do
            if ! printf '%s\n' "$stripped" | grep -q "^## $h"; then
              echo "::error::PR 描述缺少必填节 '## $h'（模板见 .github/pull_request_template.md）"
              fail=1
            elif [ -z "$(section "$h" | tr -d '[:space:]')" ]; then
              echo "::error::必填节 '## $h' 是空的——填上内容，不要删掉注释了事"
              fail=1
            fi
          done

          git fetch --no-tags --prune origin "$BASE_REF"
          range="origin/${BASE_REF}...HEAD"

          # 自建信号：新增脚本/第一方工具，或任一已有脚本在本 PR 净增超过
          # 100 行。后者按文件判，避免用另一文件的删除抵消大段自建代码；
          # --find-renames 让纯移动保持 0/0，不把移动误判成新增。
          new_scripts=$(git diff --name-only --diff-filter=A "$range" \
            | grep -E '(\.(sh|bash|py|pl|rb|js|mjs|cjs|ts)$|^src/build/tools/)' || true)
          grown_scripts=$(git diff --numstat --find-renames --diff-filter=MR "$range" \
            | awk -F '\t' '
                $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ {
                  path = $3
                  if (path ~ /(\.(sh|bash|py|pl|rb|js|mjs|cjs|ts)(}|$)|^src\/build\/tools\/)/ && ($1 - $2) > 100) {
                    printf "%s\t+%d net lines\n", path, $1 - $2
                  }
                }
              ')

          # 三方信号：依赖锁与 vendored 目录。改动也算，因为加一个 crate 是改
          # Cargo.lock、不是新增文件；reindeer 重新生成 BUCK 同理。
          new_deps=$(git diff --name-only "$range" \
            | grep -E '(^src/third-party/|(^|/)Cargo\.lock$|(^|/)package(-lock)?\.json$|(^|/)pnpm-lock\.yaml$|(^|/)yarn\.lock$)' || true)

          research=$(section 业界方案调研)

          # 自建时「不适用」不是回答：问题恰恰适用，你只是选了自建。
          # 判前缀而不判全等，因为加一个句号就能绕过全等。
          case "$(printf '%s' "$research" | tr -d '[:space:]')" in
            不适用*)
              if [ -n "$new_scripts" ] || [ -n "$grown_scripts" ]; then
                echo "::error::本 PR 新增了脚本/第一方工具，或已有脚本净增超过 100 行，'业界方案调研'节却以「不适用」开头："
                printf '%s\n' "$new_scripts"
                printf '%s\n' "$grown_scripts"
                echo "::error::写清查过哪些业界方案与平台 native 机制、为何仍要自建。"
                fail=1
              fi
              ;;
          esac

          # 引入三方依赖必须先有 docs/research/ 的对象文件（AGENTS.md 纪律三）。
          if [ -n "$new_deps" ] && ! printf '%s' "$research" | grep -q 'docs/research/'; then
            echo "::error::本 PR 改动了三方依赖或依赖锁，'业界方案调研'节必须引用 docs/research/ 下的对象文件："
            printf '%s\n' "$new_deps"
            echo "::error::纪律见 AGENTS.md 第三条：新组件、新依赖先落 docs/research/（一对象一文件），再写代码。"
            fail=1
          fi

          exit "$fail"

      - name: Check commit attribution trailers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # AGENTS.md「提交署名」：harness 产出的每个提交末尾一席一行
          #   Co-authored-by: <harness> <模型> effort=<档位> <用户号+bot[bot]@users.noreply.github.com>
          # 邮箱清单与 AGENTS.md 的表一起改。规矩 2026-10-06 落库，之前的提交不查；
          # GitHub 网页上直接改的提交（提交者是 GitHub）不查。
          cutoff='2026-10-06T00:00:00+08:00'
          allowed='281844019+a-claude-code-bot[bot]@users.noreply.github.com
          281847692+a-chatgpt-codex-bot[bot]@users.noreply.github.com
          302482056+a-grok-build-bot[bot]@users.noreply.github.com
          295901900+an-antigravity-cli-bot[bot]@users.noreply.github.com
          281852327+a-kimi-code-bot[bot]@users.noreply.github.com
          281849308+a-qwen-qoder-bot[bot]@users.noreply.github.com
          281851494+a-deepseek-code-bot[bot]@users.noreply.github.com
          281846436+a-glm-code-bot[bot]@users.noreply.github.com
          281853025+a-minimax-code-bot[bot]@users.noreply.github.com
          327610061+a-muse-code-bot[bot]@users.noreply.github.com
          281848501+a-gemini-cli-bot[bot]@users.noreply.github.com'
          allowed=$(printf '%s\n' "$allowed" | sed 's/^ *//')
          pattern='^[Cc]o-[Aa]uthored-[Bb]y: [^<>]+ [^ <>]+ effort=[A-Za-z0-9._-]+ <[0-9]+\+[a-z0-9-]+\[bot\]@users\.noreply\.github\.com>$'

          git fetch --no-tags --prune origin "$BASE_REF"
          fail=0
          for sha in $(git rev-list --no-merges --since="$cutoff" "origin/${BASE_REF}..HEAD"); do
            short=$(git rev-parse --short "$sha")
            if [ "$(git show -s --format=%ce "$sha")" = "noreply@github.com" ]; then
              continue
            fi
            lines=$(git show -s --format=%B "$sha" | grep -i -E '^Co-authored-by:' || true)
            if [ -z "$lines" ]; then
              echo "::error::提交 $short 没有署名行。按 AGENTS.md「提交署名」加一行：Co-authored-by: <harness> <模型> effort=<档位> <bot 邮箱>"
              fail=1
              continue
            fi
            while IFS= read -r line; do
              if ! printf '%s\n' "$line" | grep -q -E "$pattern"; then
                echo "::error::提交 $short 的署名行格式不对：$line"
                echo "::error::要求：Co-authored-by: <harness> <模型> effort=<档位> <用户号+bot[bot]@users.noreply.github.com>（见 AGENTS.md「提交署名」）"
                fail=1
                continue
              fi
              email=$(printf '%s' "$line" | sed -E 's/.*<([^>]+)>$/\1/')
              if ! printf '%s\n' "$allowed" | grep -q -x -F "$email"; then
                echo "::error::提交 $short 的署名邮箱不在 AGENTS.md 的表里：$email（数字要用 bot 账号的用户号，不是 App ID）"
                fail=1
              fi
            done <<< "$lines"
          done
          exit "$fail"
