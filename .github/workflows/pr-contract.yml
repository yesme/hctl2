name: PR contract

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: PR contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Check required PR sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          stripped=$(printf '%s' "$PR_BODY" | perl -0777 -pe 's/<!--.*?-->//gs; s/\r//g')

          section() {
            printf '%s\n' "$stripped" | awk -v h="## $1" '
              index($0, h) == 1 {found=1; next}
              /^## / {if (found) exit}
              found {print}
            '
          }

          fail=0
          for h in 定位与重述 当前生效约束集 业界方案调研; do
            if ! printf '%s\n' "$stripped" | grep -q "^## $h"; then
              echo "::error::PR 描述缺少必填节 '## $h'（模板见 .github/pull_request_template.md）"
              fail=1
            elif [ -z "$(section "$h" | tr -d '[:space:]')" ]; then
              echo "::error::必填节 '## $h' 是空的——填上内容，不要删掉注释了事"
              fail=1
            fi
          done

          git fetch --no-tags --prune origin "$BASE_REF"
          range="origin/${BASE_REF}...HEAD"

          # 自建信号：新增的脚本或第一方工具。只看新增文件，改已有脚本不算。
          new_scripts=$(git diff --name-only --diff-filter=A "$range" \
            | grep -E '(\.(sh|bash|py|pl|rb|js|mjs|cjs|ts)$|^src/build/tools/)' || true)

          # 三方信号：依赖锁与 vendored 目录。改动也算，因为加一个 crate 是改
          # Cargo.lock、不是新增文件；reindeer 重新生成 BUCK 同理。
          new_deps=$(git diff --name-only "$range" \
            | grep -E '(^src/third-party/|(^|/)Cargo\.lock$|(^|/)package(-lock)?\.json$|(^|/)pnpm-lock\.yaml$|(^|/)yarn\.lock$)' || true)

          research=$(section 业界方案调研)

          # 自建时「不适用」不是回答：问题恰恰适用，你只是选了自建。
          # 判前缀而不判全等，因为加一个句号就能绕过全等。
          case "$(printf '%s' "$research" | tr -d '[:space:]')" in
            不适用*)
              if [ -n "$new_scripts" ]; then
                echo "::error::本 PR 新增了脚本或第一方工具，'业界方案调研'节却以「不适用」开头："
                printf '%s\n' "$new_scripts"
                echo "::error::写清查过哪些业界方案与平台 native 机制、为何仍要自建。"
                fail=1
              fi
              ;;
          esac

          # 引入三方依赖必须先有 docs/research/ 的对象文件（AGENTS.md 纪律三）。
          if [ -n "$new_deps" ] && ! printf '%s' "$research" | grep -q 'docs/research/'; then
            echo "::error::本 PR 改动了三方依赖或依赖锁，'业界方案调研'节必须引用 docs/research/ 下的对象文件："
            printf '%s\n' "$new_deps"
            echo "::error::纪律见 AGENTS.md 第三条：新组件、新依赖先落 docs/research/（一对象一文件），再写代码。"
            fail=1
          fi

          exit "$fail"
