name: External dependencies

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - "LICENSE"
      - "docs/usage.md"
      - "src/.buckconfig"
      - "src/.buckroot"
      - "src/buck2"
      - "src/Cargo.toml"
      - "src/build/execution/**"
      - "src/build/tools/bazel-remote-bin"
      - "src/build/tools/buck2-cache"
      - "src/build/tools/buck2-bin"
      - "src/packaging/dependencies/**"
      - "src/packaging/release/assets/**"
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - "LICENSE"
      - "docs/usage.md"
      - "src/.buckconfig"
      - "src/.buckroot"
      - "src/buck2"
      - "src/Cargo.toml"
      - "src/build/execution/**"
      - "src/build/tools/bazel-remote-bin"
      - "src/build/tools/buck2-cache"
      - "src/build/tools/buck2-bin"
      - "src/packaging/dependencies/**"
      - "src/packaging/release/assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static contract
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check shell syntax
        run: >-
          find src/packaging/dependencies -type f
          \( -name '*.sh' -o -name hctl2-services \) -print0
          | xargs -0 bash -n

      - name: Check release document snapshots
        run: |
          cmp LICENSE src/packaging/release/assets/LICENSE
          cmp docs/usage.md src/packaging/release/assets/USAGE.md

      - name: Check service command contract
        run: |
          src/packaging/dependencies/hctl2-services --help | grep -F 'Usage:'
          if src/packaging/dependencies/hctl2-services status unexpected >/dev/null 2>&1; then
            echo 'hctl2-services accepted an argument for status' >&2
            exit 1
          fi

  package-lifecycle:
    name: Package lifecycle / ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-26.04
            buck_target: linux_x86_64_gnu
            cache_enabled: "0"
          - platform: macOS x86_64
            runner: macos-15-intel
            buck_target: macos_x86_64
            cache_enabled: "1"
          - platform: macOS arm64
            runner: macos-15
            buck_target: macos_arm64
            cache_enabled: "1"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: ${{ matrix.cache_enabled }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Configure Buck2 dependency action cache
        if: matrix.cache_enabled == '1'
        run: echo "HCTL2_BUCK2_CACHE_DIR=$RUNNER_TEMP/hctl2-buck2-reapi" >> "$GITHUB_ENV"

      - name: Identify runner toolchain image
        if: matrix.cache_enabled == '1'
        id: cache-platform
        run: |
          test -n "${ImageOS:-}" && test -n "${ImageVersion:-}"
          echo "runner-image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore Buck2 dependency action cache
        if: matrix.cache_enabled == '1'
        id: dependency-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/hctl2-buck2-reapi/data
          key: buck2-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.buck_target }}-${{ steps.cache-platform.outputs.runner-image }}-${{ hashFiles('src/buck2', 'src/build/tools/buck2-bin', 'src/build/tools/bazel-remote-bin', 'src/build/tools/buck2-cache', 'src/.buckconfig', 'src/build/execution/**', 'src/build/toolchains/**', 'src/packaging/dependencies/defs.bzl', 'src/packaging/dependencies/lock.json', 'src/packaging/dependencies/common/action.sh', 'src/packaging/dependencies/platforms/macos/common.sh', 'src/packaging/dependencies/platforms/macos/tuwunel.sh') }}
          restore-keys: |
            buck2-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.buck_target }}-

      - name: Install pinned DotSlash
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Test external package and offline lifecycle with Buck2
        run: >-
          ./buck2 test root//packaging/dependencies:package-test
          --target-platforms root//build/platforms:${{ matrix.buck_target }}

      - name: Probe tmux P0 control-mode seam
        run: |
          output="$(./buck2 build root//packaging/dependencies:tmux \
            --target-platforms root//build/platforms:${{ matrix.buck_target }} \
            --show-output | awk '$1 == "root//packaging/dependencies:tmux" { print $2 }')"
          test -n "$output"
          binary="$(find "$output" -type f -path '*/bin/tmux' -print -quit)"
          test -x "$binary"
          python3 testing/tmux/p0_control_mode.py --tmux "$binary"

      - name: Verify exact cache restored Tuwunel
        if: matrix.cache_enabled == '1' && steps.dependency-cache.outputs.cache-hit == 'true'
        run: |
          ./build/tools/buck2-bin log show | jq -s -e '
            any(.[].Event.data.SpanEnd.data.ActionExecution?;
              .key.owner.TargetLabel.label.name == "tuwunel"
              and any(
                .commands[]?.details.command_kind.command.RemoteCommand.cache_hit?;
                . == true
              )
            )
          '

      - name: Stop Buck2 dependency action cache
        if: ${{ always() && matrix.cache_enabled == '1' }}
        run: build/tools/buck2-cache stop
