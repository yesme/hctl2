name: External dependencies

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dependencies.yml"
      - "src/packaging/dependencies/**"
  pull_request:
    paths:
      - ".github/workflows/dependencies.yml"
      - "src/packaging/dependencies/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static contract
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check shell syntax
        run: >-
          find src/packaging/dependencies -type f
          \( -name '*.sh' -o -name hctl2-services \) -print0
          | xargs -0 bash -n

      - name: Check service command contract
        run: |
          src/packaging/dependencies/hctl2-services --help | grep -F 'Usage:'
          if src/packaging/dependencies/hctl2-services status unexpected >/dev/null 2>&1; then
            echo 'hctl2-services accepted an argument for status' >&2
            exit 1
          fi

  package-lifecycle:
    name: Package lifecycle / ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-26.04
            target: linux-x86_64
            buck_target: linux_x86_64_gnu
          - platform: macOS x86_64
            runner: macos-15-intel
            target: macos-x86_64
            buck_target: macos_x86_64
          - platform: macOS arm64
            runner: macos-15
            target: macos-aarch64
            buck_target: macos_arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    env:
      BUCK_CONSOLE: simple

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned DotSlash
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Build external subsystems with Buck2
        run: >-
          ./buck2 build root//packaging/dependencies:prepared
          --target-platforms root//build/platforms:${{ matrix.buck_target }}
          --out "$RUNNER_TEMP/hctl2-build-cache"

      - name: Test offline install and lifecycle
        env:
          HCTL2_BUILD_CACHE: ${{ runner.temp }}/hctl2-build-cache
          HCTL2_SKIP_BOOTSTRAP: "1"
        run: packaging/dependencies/test-package-${{ matrix.target }}.sh
