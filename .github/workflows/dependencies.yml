name: External dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Static contract
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check shell syntax
        run: >-
          find src/packaging/dependencies -type f
          \( -name '*.sh' -o -name hctl2-services \) -print0
          | xargs -0 bash -n

      - name: Check release document snapshots
        run: |
          cmp LICENSE src/packaging/release/assets/LICENSE
          cmp docs/usage.md src/packaging/release/assets/USAGE.md

      - name: Check service command contract
        run: |
          src/packaging/dependencies/hctl2-services --help | grep -F 'Usage:'
          if src/packaging/dependencies/hctl2-services status unexpected >/dev/null 2>&1; then
            echo 'hctl2-services accepted an argument for status' >&2
            exit 1
          fi

  package-lifecycle:
    name: Package lifecycle / ${{ matrix.platform }}
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-26.04
            buck_target: linux_x86_64_gnu
          - platform: macOS x86_64
            runner: macos-15-intel
            buck_target: macos_x86_64
          - platform: macOS arm64
            runner: macos-15
            buck_target: macos_arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    env:
      BUCK_CONSOLE: simple
      HCTL2_BUCK2_CACHE: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install DotSlash on Linux
        if: runner.os == 'Linux'
        uses: facebook/install-dotslash@0971fd2071b83392cf02706266fee3877e3bcaf3

      - name: Install pinned DotSlash on macOS
        if: runner.os == 'macOS'
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Verify pinned DotSlash
        run: |
          . build/tools/dotslash.env
          test "$(dotslash --version)" = "DotSlash ${DOTSLASH_VERSION#v}"

      - name: Test external package and offline lifecycle with Buck2
        run: >-
          ./buck2 test root//packaging/dependencies:package-test
          --target-platforms root//build/platforms:${{ matrix.buck_target }}
