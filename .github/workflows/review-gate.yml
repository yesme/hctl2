name: Review gate

# Asking for review is a PR state, not a comment: a PR opens as a draft and the
# author's `gh pr ready` is the request. A ready PR whose current head has a
# failed required check goes back to draft, with a comment naming the checks,
# so nobody reviews or waits on a red head and the author is told without
# anyone watching. The required checks are the three main's protection asks for.
# It covers same-repository branches, which is how every seat works; a fork's
# pull_request token is read-only and its workflow_run may name no PR.

on:
  pull_request:
    types: [ready_for_review]
  workflow_run:
    workflows: [Code, Release, PR contract]
    types: [completed]

permissions:
  # convertPullRequestToDraft refuses an Actions token without contents: write
  # ("Resource not accessible by integration", #439's probe run 39013169576).
  contents: write
  checks: read
  pull-requests: write

# One queue per PR for both triggers, so a ready event and a finished run never
# send the same PR back twice.
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Review gate
    runs-on: ubuntu-24.04
    # A few API calls; no checkout, so the PR's code never runs with this token.
    timeout-minutes: 5
    steps:
      - name: Send a ready PR with a red required check back to draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          # Ready, open, and still at the head this event is about.
          judged() {
            gh pr view "$1" -R "$REPO" --json state,isDraft,headRefOid \
              --jq 'if .state == "OPEN" and .isDraft == false and .headRefOid == $ENV.EVENT_HEAD then "yes" else "no" end'
          }
          # Each run of a workflow is its own check suite, and check-runs keeps
          # the latest run per suite: a description edit that turned PR contract
          # green leaves the earlier red run beside it. Judge only the newest
          # run of each required check.
          red() {
            gh api "repos/$REPO/commits/$EVENT_HEAD/check-runs?per_page=100" --paginate --slurp |
              jq -r '[.[].check_runs[]
                  | select(.name == "CI gate" or .name == "Release gate" or .name == "PR contract")]
                | group_by(.name) | map(max_by(.id)) | .[]
                | select(.conclusion == "failure" or .conclusion == "timed_out")
                | "- \(.name)：\(.html_url)"'
          }

          if [ "$EVENT" = pull_request ]; then
            prs="$EVENT_PR"
          else
            prs=$(printf '%s' "$RUN_PRS" | jq -r '.[].number')
          fi

          for pr in $prs; do
            [ "$(judged "$pr")" = yes ] || continue
            failed=$(red)
            [ -n "$failed" ] || continue
            # Look again right before writing: a push or a green rerun since the
            # first look narrows the window, though GitHub's mutation takes no
            # expected head, so it cannot close it.
            [ "$(judged "$pr")" = yes ] || continue
            failed=$(red)
            [ -n "$failed" ] || continue
            gh pr ready "$pr" -R "$REPO" --undo
            gh pr comment "$pr" -R "$REPO" --body "$(printf '%s\n' \
              "## Review gate · 当前头 \`${EVENT_HEAD:0:7}\` 的必需检查红了，已退回草稿" \
              "" \
              "$failed" \
              "" \
              "作者修好、检查转绿后 \`gh pr ready $pr\` 再请审。评审席在它重新就绪之前不审；就绪之后对新头重新确认。")"
          done
