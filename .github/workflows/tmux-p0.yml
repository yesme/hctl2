name: Disposable tmux P0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-mode-seam:
    name: Control-mode seam / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            buck_target: linux_x86_64_gnu
            package_target: linux-x86_64
          - platform: macOS x86_64
            runner: macos-15-intel
            buck_target: macos_x86_64
            package_target: macos-x86_64
          - platform: macOS arm64
            runner: macos-15
            buck_target: macos_arm64
            package_target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    env:
      HCTL2_BUCK2_CACHE: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned DotSlash
        run: |
          build/tools/install-dotslash "$RUNNER_TEMP/hctl2-tools"
          echo "$RUNNER_TEMP/hctl2-tools" >> "$GITHUB_PATH"

      - name: Build locked tmux distribution action
        id: build
        run: |
          output="$('./buck2' build root//packaging/dependencies:tmux \
            --target-platforms 'root//build/platforms:${{ matrix.buck_target }}' \
            --show-output | awk '$1 == "root//packaging/dependencies:tmux" { print $2 }')"
          test -n "$output"
          binary="$output/${{ matrix.package_target }}/bin/tmux"
          test -x "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Probe owner control-mode seam
        run: python3 testing/tmux/p0_control_mode.py --tmux '${{ steps.build.outputs.binary }}'
